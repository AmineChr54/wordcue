<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The lens, in cut paper</title>
<style>
  @font-face { font-family:Fredoka; font-weight:600; src:url(../../docs/fonts/fredoka-600.woff2) format('woff2'); }
  :root { --red:#E8432E; --yellow:#FFD23F; --teal:#0E8A8A; --deep:#0A5F6A; --white:#FFF7E6; --ink:#2A1A1F; }
  #fit { width:1600px; height:900px; }
  #stage { position:relative; width:1600px; height:900px; overflow:hidden; background:var(--red); color:var(--white); font:600 90px/1.04 Fredoka,sans-serif; }
  #world { position:absolute; left:0; top:0; width:1600px; height:900px; }
  .paper { position:absolute; filter:drop-shadow(7px 8px 0 rgba(42,26,31,.28)); }
  .pop { transform-origin:50% 100%; }
  .say { position:absolute; opacity:0; }
  .wave { position:absolute; left:-100px; width:1800px; height:320px; }
  #wave1 { top:640px; background:var(--teal); clip-path:path('M0 60 Q 75 0 150 60 T 300 60 T 450 60 T 600 60 T 750 60 T 900 60 T 1050 60 T 1200 60 T 1350 60 T 1500 60 T 1650 60 T 1800 60 V320 H0 Z'); }
  #wave2 { top:730px; background:var(--deep); clip-path:path('M0 50 Q 90 -10 180 50 T 360 50 T 540 50 T 720 50 T 900 50 T 1080 50 T 1260 50 T 1440 50 T 1620 50 T 1800 50 V320 H0 Z'); }
  #tower { left:210px; top:300px; width:150px; height:400px; clip-path:polygon(24% 0, 76% 0, 100% 100%, 0 100%); background:repeating-linear-gradient(180deg,var(--white) 0 80px,var(--ink) 80px 160px); }
  #lamp { left:232px; top:230px; width:106px; height:80px; background:var(--yellow); border-radius:40px 40px 0 0; }
  .ray { position:absolute; left:285px; top:270px; width:360px; height:66px; background:var(--yellow); transform-origin:0 50%; clip-path:polygon(0 42%, 100% 0, 100% 100%, 0 58%); opacity:0; }
  .ring { position:absolute; border-radius:50%; border:16px solid var(--white); left:285px; top:270px; opacity:0; }
  #beam { left:285px; top:230px; width:1320px; height:80px; background:var(--yellow); transform-origin:0 50%; clip-path:polygon(0 30%, 100% 0, 100% 100%, 0 70%); opacity:0; }
  #ship { left:1240px; top:600px; width:210px; height:96px; opacity:0; }
  #ship i { position:absolute; left:0; bottom:0; width:210px; height:54px; background:var(--white); clip-path:polygon(0 0, 100% 0, 84% 100%, 14% 100%); }
  #ship b { position:absolute; left:70px; bottom:50px; width:70px; height:46px; background:var(--ink); }
  #ruler { left:640px; top:380px; width:760px; height:100px; background:var(--white); color:var(--ink); font-size:58px; display:flex; align-items:center; justify-content:center; opacity:0; }
  #tag { position:absolute; right:30px; top:22px; font:600 28px Fredoka,sans-serif; color:var(--white); z-index:3; }
  #ai { position:absolute; left:640px; top:836px; color:var(--white); font-size:32px; opacity:0; }
</style>
</head>
<body>
<div id="fit"><div id="stage"><div id="world">
  <div class="say" id="s1" style="left:720px;top:90px;width:820px">A flame shines<br>every which way</div>
  <div class="say" id="s2" style="left:720px;top:90px;width:820px">Most of it is wasted</div>
  <div class="say" id="s3a" style="left:720px;top:90px">1823,</div>
  <div class="say" id="s3d" style="left:960px;top:90px">Cordouan.</div>
  <div class="say" id="s3b" style="left:720px;top:200px">Fresnel adds</div>
  <div class="say" id="s3c" style="left:720px;top:310px">rings of glass</div>
  <div class="say" id="s4" style="left:720px;top:90px;width:820px">A flat beam</div>
  <div class="paper pop" id="tower"></div>
  <div class="paper pop" id="lamp"></div>
  <div id="rays"></div>
  <div id="ringset"></div>
  <div class="paper" id="beam"></div>
  <div class="paper" id="ruler">more than 32 km</div>
  <div class="paper pop" id="ship"><b></b><i></i></div>
  <div class="paper wave" id="wave1"></div>
  <div class="paper wave" id="wave2"></div>
  <div id="ai">Simplified, not to scale. Source: Wikipedia, “Fresnel lens”.</div>
</div><div id="tag">AI voice · Made with Wordcue</div></div></div>
<script src="build/timing.js"></script>
<script src="../../engine/film.js"></script>
<script src="../../engine/player.js"></script>
<script>
const rays = document.getElementById('rays');
const ANGLES = [-165, -135, -105, -75, -45, -15, 15, 45];
ANGLES.forEach((a, i) => {
  const r = rays.appendChild(document.createElement('div'));
  r.className = 'ray paper'; r.id = `ray${i}`; r.style.rotate = `${a}deg`;
});
const ringset = document.getElementById('ringset');
[120, 220, 320].forEach((size, i) => {
  const r = ringset.appendChild(document.createElement('div'));
  r.className = 'ring paper'; r.id = `ring${i}`;
  r.style.width = r.style.height = `${size}px`;
  r.style.margin = `-${size / 2}px 0 0 -${size / 2}px`;
});

/* Everything arrives with a bounce and a small tilt, the way a paper sticker lands. */
const BOUNCE = 'cubic-bezier(.3,1.7,.5,1)';
const pop = (at, el, stagger = 0, tilt = -7) => ({ at, anim: el, kf: { opacity: [0, 1], transform: [`scale(.2) rotate(${tilt}deg)`, 'none'] }, dur: .42, ease: BOUNCE, stagger });
const away = (at, el) => ({ at, anim: el, kf: { opacity: [1, 0], transform: ['none', 'scale(.7) rotate(6deg)'] }, dur: .18, ease: 'in' });

const STEPS = [
  /* The sea bobs for the whole film, as a pure function of the time. */
  { at: 0, dur: TIMING.duration, fn: (p, t) => {
    document.getElementById('wave1').style.transform = `translate(${Math.sin(t * 1.3) * 26}px,${Math.sin(t * 2.1) * 9}px)`;
    document.getElementById('wave2').style.transform = `translate(${Math.sin(t * 1.1 + 2) * -34}px,${Math.sin(t * 1.7 + 1) * 11}px)`;
  } },
  pop(0, '#tower', 0, -3),
  pop(.15, '#lamp', 0, 6),

  pop('l1', '#s1', 0, -3),
  { at: 'l1:every', anim: '.ray', kf: { opacity: [0, 1], transform: ['scaleX(0)', 'scaleX(1)'] }, dur: .36, ease: BOUNCE, stagger: .09 },
  away('l1:most', '#s1'),
  pop('l1:most', '#s2', 0, 4),

  away('l2-0.1', '#s2'),
  pop('l2:eighteen', '#s3a', 0, -4),
  pop('l2:Cordouan', '#s3d', 0, 5),
  pop('l2:Augustin', '#s3b', 0, 4),
  pop('l2:thin', '#s3c', 0, -3),
  { at: 'l2:thin', anim: '.ring', kf: { opacity: [0, 1], transform: ['scale(0)', 'none'] }, dur: .42, ease: BOUNCE, stagger: .2 },

  away('l3', '#s3a, #s3d, #s3b, #s3c'),
  { at: 'l3:bends', anim: '.ray', kf: { transform: ['scaleX(1)', 'scaleX(0)'] }, dur: .3, ease: 'in', stagger: .04 },
  { at: 'l3:flat', anim: '#beam', kf: { opacity: [0, 1], transform: ['scaleX(0)', 'none'] }, dur: .45, ease: BOUNCE },
  pop('l3:flat', '#s4', 0, 3),

  away('l4', '#s4'),
  pop('l4:Ships', '#ship', 0, 8),
  pop('l4:more', '#ruler', 0, -3),
  { at: 'l4.end', anim: '#ai', kf: { opacity: [0, 1] }, dur: .3, ease: 'linear' },
];

FilmPlayer.start(() => Film.create({ stage: '#stage', world: '#world', timing: TIMING, steps: STEPS }),
  { fit: '#fit', audio: 'build/narration.wav', timing: TIMING });
</script>
</body>
</html>
