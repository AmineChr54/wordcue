<script>/* Declarative steps compile to one timeline. render(t) is a pure function of t, so the
   live player and the frame-by-frame MP4 renderer draw exactly the same picture. */
(function () {
  const EASE = {
    move: [.45, .05, .25, 1],
    out: [.16, 1, .3, 1],
    in: [.6, 0, .9, .3],
    linear: null,
  };
  const css = name => {
    const b = EASE[name];
    if (name in EASE) return b ? `cubic-bezier(${b.join(',')})` : 'linear';
    return name || css('out');
  };

  function bezier([x1, y1, x2, y2]) {
    const at = (a, b, s) => 3 * a * s * (1 - s) ** 2 + 3 * b * s * s * (1 - s) + s ** 3;
    return x => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let lo = 0, hi = 1, s = x;
      for (let i = 0; i < 24; i++) {
        const v = at(x1, x2, s);
        if (Math.abs(v - x) < 1e-5) break;
        if (v < x) lo = s; else hi = s;
        s = (lo + hi) / 2;
      }
      return at(y1, y2, s);
    };
  }
  const easeFn = name => {
    const b = EASE[name];
    return b ? bezier(b) : (p => Math.min(1, Math.max(0, p)));
  };
  const clamp01 = v => Math.min(1, Math.max(0, v));

  const norm = s => s.toLowerCase().replace(/ß/g, 'ss').replace(/[^\p{L}\p{N}]/gu, '');

  /* Anchors: 12.5 | "line" | "line.end" | "line:Wort" | "line:Wort#2" | "line:Wort.end", each with
     an optional +0.4 or -0.1 suffix. "+0.4" alone is relative to the previous step. */
  function resolver(timing) {
    const lines = new Map(timing.lines.map(l => [l.id, l]));
    let prev = 0;
    return function at(anchor) {
      if (typeof anchor === 'number') return prev = anchor;
      const rel = anchor.match(/^\+([\d.]+)$/);
      if (rel) return prev = prev + parseFloat(rel[1]);
      const m = anchor.match(/^([\w-]+)(?::([^#.+\-\s]+)(?:#(\d+))?)?(\.end)?([+-][\d.]+)?$/);
      if (!m) throw new Error(`Bad anchor "${anchor}"`);
      const [, id, word, nth, end, off] = m;
      const line = lines.get(id);
      if (!line) throw new Error(`Anchor "${anchor}": no line "${id}"`);
      let t;
      if (word) {
        const wanted = norm(word);
        const hits = line.words.filter(w => norm(w.w).startsWith(wanted));
        const hit = hits[(nth ? +nth : 1) - 1];
        if (!hit) throw new Error(`Anchor "${anchor}": the line no longer says "${word}". It says: ${line.say}`);
        t = end ? hit.end : hit.start;
      } else t = end ? line.end : line.start;
      return prev = t + (off ? parseFloat(off) : 0);
    };
  }

  const each = (sel, root) => {
    if (sel instanceof Element) return [sel];
    const found = [...root.querySelectorAll(sel)];
    if (!found.length) throw new Error(`Selector "${sel}" matches nothing`);
    return found;
  };

  function propsOf(kf) {
    const skip = new Set(['offset', 'easing', 'composite']);
    const frames = Array.isArray(kf) ? kf : [kf];
    return [...new Set(frames.flatMap(f => Object.keys(f)))].filter(k => !skip.has(k));
  }

  function create({ stage, world, timing, steps, width = 1600, height = 900, cursor, reduced = false }) {
    const root = typeof stage === 'string' ? document.querySelector(stage) : stage;
    const camEl = typeof world === 'string' ? document.querySelector(world) : world;
    const at = resolver(timing);
    const owned = [];
    const anims = [];   // {a, start}
    const fns = [];     // pure per-frame writers
    const states = [];  // {t, el, cls, on, text}
    const animated = new WeakMap();
    let end = timing.duration || 0;

    const camKeys = [{ t: 0, x: width / 2, y: height / 2, z: 1, dur: 0, ease: 'move' }];
    const cursorKeys = [];
    const cursorOffs = [];
    const ripples = [];

    camEl.style.transformOrigin = '0 0';
    camEl.style.transform = 'none';

    const centre = (el, aim = .5) => {
      const w = camEl.getBoundingClientRect(), r = el.getBoundingClientRect();
      const k = camEl.offsetWidth ? w.width / camEl.offsetWidth : 1;
      return { x: (r.left - w.left + r.width * aim) / k, y: (r.top - w.top + r.height / 2) / k, w: r.width / k };
    };

    for (const s of steps) {
      const t = at(s.at);
      if (s.anim) {
        const dur = s.dur ?? .5;
        const kf = s.kf;
        each(s.anim, root).forEach((el, i) => {
          const start = t + (s.stagger || 0) * i;
          // Only the first animation of a property holds its start value before it begins.
          // A later one must not override what came before it until its own time arrives.
          const seen = animated.get(el) || new Set();
          const props = propsOf(kf);
          const first = props.some(p => !seen.has(p));
          props.forEach(p => seen.add(p));
          animated.set(el, seen);
          const a = el.animate(kf, { duration: dur * 1000, easing: css(s.ease), fill: first ? 'both' : 'forwards' });
          a.pause();
          owned.push(a);
          anims.push({ a, start });
          end = Math.max(end, start + dur);
        });
      } else if (s.set) {
        each(s.set, root).forEach(el => states.push({ t, el, cls: s.cls, on: s.on !== false, text: s.text }));
      } else if (s.type) {
        const [el] = each(s.type, root);
        const text = s.text ?? el.textContent;
        el.textContent = '';
        const shown = el.appendChild(document.createElement('span'));
        const rest = el.appendChild(document.createElement('span'));
        rest.style.visibility = 'hidden';
        rest.textContent = text; // Keeps the final layout from the start, so nothing reflows while typing.
        const dur = s.dur ?? text.length * .045;
        let last = -1;
        fns.push(now => {
          const n = Math.round(clamp01((now - t) / dur) * text.length);
          if (n === last) return;
          last = n;
          shown.textContent = text.slice(0, n);
          rest.textContent = text.slice(n);
        });
        end = Math.max(end, t + dur);
      } else if (s.count) {
        const [el] = each(s.count, root);
        const dur = s.dur ?? .8, ease = easeFn(s.ease || 'out');
        const fmt = s.fmt || (v => String(Math.round(v)));
        fns.push(now => {
          if (now < t && s.hold !== true) { el.textContent = fmt(s.from ?? 0); return; }
          el.textContent = fmt((s.from ?? 0) + ((s.to ?? 0) - (s.from ?? 0)) * ease((now - t) / dur));
        });
      } else if (s.camera !== undefined) {
        const f = s.focus ? centre(each(s.focus, root)[0]) : null;
        camKeys.push({
          t, dur: reduced ? 0 : (s.dur ?? .65), ease: s.ease || 'move', z: s.zoom ?? 1,
          x: s.x ?? (f ? f.x : width / 2), y: s.y ?? (f ? f.y : height / 2),
        });
      } else if (s.cursor) {
        // The cursor arrives at the anchor, so a click lands exactly on the spoken word.
        const target = centre(each(s.cursor, root)[0], .3);
        const aim = target.w > 240 ? target : centre(each(s.cursor, root)[0]);
        const from = cursorKeys.length ? cursorKeys[cursorKeys.length - 1] : { x: width * .7, y: height * .8 };
        const dist = Math.hypot(aim.x - from.x, aim.y - from.y);
        const dur = s.dur ?? Math.min(1.3, Math.max(.55, (450 + dist * .85) / 1000));
        cursorKeys.push({ start: t - dur, t, x: aim.x, y: aim.y, fromX: from.x, fromY: from.y });
        if (s.click) ripples.push({ t, x: aim.x, y: aim.y });
      } else if (s.cursorOff) {
        cursorOffs.push(t);
      } else if (s.fn) {
        const dur = s.dur ?? 1, ease = easeFn(s.ease || 'linear');
        fns.push(now => s.fn(ease((now - t) / dur), now - t));
        end = Math.max(end, t + dur);
      } else {
        throw new Error(`Step does nothing: ${JSON.stringify(s)}`);
      }
    }

    states.sort((a, b) => a.t - b.t);
    camKeys.sort((a, b) => a.t - b.t);
    for (let i = 1; i < camKeys.length; i++) camKeys[i].ease = easeFn(camKeys[i].ease);

    function cameraAt(now) {
      let i = 0;
      while (i + 1 < camKeys.length && camKeys[i + 1].t <= now) i++;
      const k = camKeys[i], prev = camKeys[i - 1];
      if (!prev || !k.dur || now >= k.t + k.dur) return k;
      const p = k.ease((now - k.t) / k.dur);
      // Zoom is multiplicative, so it interpolates in log space to look even throughout.
      return {
        x: prev.x + (k.x - prev.x) * p,
        y: prev.y + (k.y - prev.y) * p,
        z: Math.exp(Math.log(prev.z) + (Math.log(k.z) - Math.log(prev.z)) * p),
      };
    }

    const cursorEl = cursor ? (typeof cursor === 'string' ? root.querySelector(cursor) : cursor) : null;
    const rippleEls = ripples.map(r => {
      const el = camEl.appendChild(document.createElement('i'));
      el.className = 'film-ripple';
      el.style.left = r.x + 'px';
      el.style.top = r.y + 'px';
      return el;
    });
    const moveEase = easeFn('move');

    function drawCursor(now) {
      if (!cursorEl) return;
      if (!cursorKeys.length || now < cursorKeys[0].start) { cursorEl.style.opacity = 0; return; }
      let i = 0;
      while (i + 1 < cursorKeys.length && cursorKeys[i + 1].start <= now) i++;
      const k = cursorKeys[i], p = moveEase((now - k.start) / (k.t - k.start));
      const x = k.fromX + (k.x - k.fromX) * p, y = k.fromY + (k.y - k.fromY) * p;
      cursorEl.style.opacity = cursorOffs.some(o => o <= now && o > k.t) ? 0 : 1;
      cursorEl.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px)`;
    }

    function drawStates(now) {
      const seen = new Map();
      for (const s of states) {
        const key = s.cls ?? '#text';
        if (!seen.has(s.el)) seen.set(s.el, new Map());
        const slots = seen.get(s.el);
        if (s.t <= now) slots.set(key, s);
        else if (!slots.has(key)) slots.set(key, { ...s, on: !s.on, text: s.el.dataset.filmText, off: true });
      }
      seen.forEach((slots, el) => slots.forEach((s, key) => {
        if (key === '#text') {
          if (el.dataset.filmText === undefined) el.dataset.filmText = el.textContent;
          el.textContent = s.off ? el.dataset.filmText : s.text;
        } else el.classList.toggle(key, s.on);
      }));
    }

    function render(now) {
      for (const { a, start } of anims) a.currentTime = (now - start) * 1000;
      const c = cameraAt(now);
      camEl.style.transform =
        `translate(${width / 2}px,${height / 2}px) scale(${c.z.toFixed(5)}) translate(${(-c.x).toFixed(2)}px,${(-c.y).toFixed(2)}px)`;
      drawStates(now);
      for (const f of fns) f(now);
      drawCursor(now);
      ripples.forEach((r, i) => {
        const p = clamp01((now - r.t) / .6), el = rippleEls[i];
        el.style.opacity = now < r.t || p >= 1 ? 0 : (1 - p) * .55;
        el.style.transform = `translate(-50%,-50%) scale(${.2 + p * 1.8})`;
      });
    }

    render(0);
    return {
      render, timing, duration: Math.max(end, timing.duration || 0), width, height,
      /* Anything that runs on its own clock would break the pure timeline, so the renderer refuses it. */
      strays() {
        return document.getAnimations().filter(a => !owned.includes(a))
          .map(a => a.animationName || a.transitionProperty || 'unnamed animation');
      },
      ready: () => Promise.all([
        document.fonts.ready,
        ...[...document.images].map(i => i.decode().catch(() => { throw new Error(`Image failed: ${i.src}`); })),
        ...owned.map(a => a.ready),
      ]),
    };
  }

  window.Film = { create, EASE };
})();

<script>/* Live player over a film: audio-locked playback, keyboard, deep links and a presenter window.
   With ?render in the URL there is no player at all: the renderer calls film.render(t) itself. */
(function () {
  const STYLE = `
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    .film-fit { position:fixed; left:50%; top:50%; transform-origin:0 0; }
    .film-bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; align-items:center;
      padding:10px 16px; background:rgba(0,0,0,.72); color:#fff; font:13px/1 "Segoe UI",system-ui,sans-serif;
      transition:opacity .2s; }
    .film-bar.idle { opacity:0; }
    .film-bar button { all:unset; cursor:pointer; padding:4px 8px; }
    .film-bar button:focus-visible { outline:2px solid #fff; }
    .film-track { flex:1; height:14px; cursor:pointer; display:flex; align-items:center; }
    .film-track i { display:block; height:3px; background:#fff; width:0; }
    .film-time { font-variant-numeric:tabular-nums; }
    body.film-presenter { background:#111; color:#eee; font:24px/1.45 "Segoe UI",system-ui,sans-serif; padding:32px; overflow:auto; }
    .film-presenter small { display:block; color:#999; font-size:15px; margin-top:24px; }
    .film-presenter .now { color:#fff; }
    .film-presenter .next { color:#888; }
  `;
  const fmt = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const channel = () => ('BroadcastChannel' in window ? new BroadcastChannel('film-player') : null);

  function presenter(timing) {
    document.body.className = 'film-presenter';
    document.body.innerHTML = '<div class="now"></div><small>Next</small><div class="next"></div><small class="clock"></small>';
    const bc = channel();
    if (!bc) return;
    bc.onmessage = ({ data }) => {
      const i = timing.lines.findIndex(l => l.id === data.line);
      document.querySelector('.now').textContent = timing.lines[i]?.text || '';
      document.querySelector('.next').textContent = timing.lines[i + 1]?.text || 'End';
      document.querySelector('.clock').textContent = `${fmt(data.t)} / ${fmt(timing.duration)} ${data.playing ? '' : '(paused)'}`;
    };
    addEventListener('keydown', e => bc.postMessage({ key: e.code }));
  }

  function play(film, { fit, audio: src }) {
    const params = new URLSearchParams(location.search);
    const audio = src ? new Audio(src) : null;
    const lines = film.timing.lines;
    const stopped = new Set();
    let t = 0, playing = false, last = 0, rate = 1;

    const box = document.querySelector(fit);
    box.classList.add('film-fit');
    const resize = () => {
      const k = Math.min(innerWidth / film.width, innerHeight / film.height);
      box.style.transform = `scale(${k}) translate(${-film.width / 2}px,${-film.height / 2}px)`;
    };
    addEventListener('resize', resize);
    resize();

    const bar = document.body.appendChild(document.createElement('div'));
    bar.className = 'film-bar';
    bar.innerHTML = `<button data-do="toggle" aria-label="Play or pause">Play</button>
      <div class="film-track" aria-label="Position"><i></i></div>
      <span class="film-time"></span>
      <button data-do="fast" aria-label="Playback speed">1x</button>
      <button data-do="presenter">Presenter</button>`;
    let idleTimer;
    const wake = () => { bar.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => playing && bar.classList.add('idle'), 2000); };
    addEventListener('mousemove', wake);

    const bc = channel();
    const lineAt = v => {
      let i = 0;
      while (i + 1 < lines.length && lines[i + 1].start <= v) i++;
      return i;
    };
    function draw() {
      film.render(t);
      bar.querySelector('.film-track i').style.width = (t / film.duration * 100) + '%';
      bar.querySelector('.film-time').textContent = `${fmt(t)} / ${fmt(film.duration)}`;
      bar.querySelector('[data-do=toggle]').textContent = playing ? 'Pause' : 'Play';
      bc && bc.postMessage({ line: lines[lineAt(t)]?.id, t, playing });
    }
    function seek(v) {
      t = Math.min(film.duration, Math.max(0, v));
      if (audio) audio.currentTime = t;
      stopped.clear();
      draw();
      if (!playing) history.replaceState(null, '', `#t=${t.toFixed(2)}`);
    }
    function setPlaying(on) {
      playing = on;
      last = performance.now();
      if (audio) { if (on) audio.play().catch(() => {}); else audio.pause(); }
      if (!on) history.replaceState(null, '', `#t=${t.toFixed(2)}`);
      wake();
      draw();
    }
    function tick(now) {
      if (playing) {
        // Audio is the master clock while it plays. The wall clock only covers silence past its end.
        const before = t;
        if (audio && !audio.ended && !audio.paused) t = audio.currentTime;
        else t += (now - last) / 1000 * rate;
        last = now;
        // Lines marked stop:true wait for a keypress, for presenting live. Frames can be far apart
        // in a throttled tab, so this looks at everything passed since the last frame.
        const line = lines.find(l => l.stop && !stopped.has(l.id) && before <= l.end && t >= l.end);
        if (line) {
          stopped.add(line.id);
          t = line.end;
          if (audio) audio.currentTime = t;
          setPlaying(false);
        }
        if (t >= film.duration) { t = film.duration; setPlaying(false); }
        draw();
      }
      requestAnimationFrame(tick);
    }
    const act = {
      toggle: () => setPlaying(!playing),
      fast() {
        rate = rate === 1 ? 2 : 1;
        if (audio) audio.playbackRate = rate;
        bar.querySelector('[data-do=fast]').textContent = rate + 'x';
      },
      presenter: () => window.open(`${location.pathname}?presenter`, 'film-presenter', 'width=720,height=520'),
      next: () => seek(lines[Math.min(lineAt(t) + 1, lines.length - 1)].start),
      back() {
        const i = lineAt(t);
        seek(t - lines[i].start > 1 ? lines[i].start : lines[Math.max(i - 1, 0)].start);
      },
    };
    const keys = { Space: 'toggle', ArrowRight: 'next', ArrowLeft: 'back', KeyF: 'fast', KeyP: 'presenter' };
    const press = code => {
      if (keys[code]) act[keys[code]]();
      else if (code === 'KeyM' && audio) audio.muted = !audio.muted;
      else if (code === 'Home') seek(0);
    };
    addEventListener('keydown', e => {
      if (!keys[e.code] && e.code !== 'KeyM' && e.code !== 'Home') return;
      e.preventDefault();
      press(e.code);
    });
    bc && (bc.onmessage = ({ data }) => data.key && press(data.key));
    bar.addEventListener('click', e => {
      const d = e.target.closest('[data-do]');
      if (d) act[d.dataset.do]();
      else if (e.target.closest('.film-track')) {
        const r = bar.querySelector('.film-track').getBoundingClientRect();
        seek((e.clientX - r.left) / r.width * film.duration);
      }
    });
    if (audio) audio.addEventListener('ended', () => { t = Math.max(t, audio.duration); });

    const hash = location.hash.match(/t=([\d.]+)/);
    if (params.get('line')) {
      const l = lines.find(x => x.id === params.get('line'));
      if (l) t = l.start;
    }
    if (hash) t = +hash[1];
    if (audio) audio.currentTime = t;
    draw();
    wake();
    requestAnimationFrame(tick);
  }

  /* One call from a film page: render mode, presenter window, or the normal player. */
  window.FilmPlayer = {
    start(buildFilm, opts) {
      const params = new URLSearchParams(location.search);
      if (params.has('presenter')) {
        const style = document.head.appendChild(document.createElement('style'));
        style.textContent = STYLE;
        return presenter(opts.timing);
      }
      const film = buildFilm();
      window.__film = film;
      if (params.has('render')) {
        document.documentElement.style.background = '#000';
        return film;
      }
      const style = document.head.appendChild(document.createElement('style'));
      style.textContent = STYLE;
      play(film, opts);
      return film;
    },
  };
})();
</script>
<script>
const line = id => TIMING.lines.find(l => l.id === id);
const cut = (at, el) => ({ at, anim: el, kf: { opacity: [0, 1] }, dur: .001, ease: 'linear' });
const off = (at, el) => ({ at, anim: el, kf: { opacity: [1, 0] }, dur: .001, ease: 'linear' });
const hit = (at, el, from = 1.25) => ({ at, anim: el, kf: { opacity: [0, 1, 1], transform: [`scale(${from})`, 'scale(.98)', 'none'], offset: [0, .55, 1] }, dur: .2, ease: 'linear' });
const stamp = t => `0:${t.toFixed(2).padStart(5, '0')}`;

/* The three takes. Bars are an illustration. The winning take and score come from this film's own timing data. */
const winner = line('a3');
const s2 = document.getElementById('s2');
[0, 1, 2].forEach(i => {
  const row = s2.appendChild(document.createElement('div'));
  row.className = 'abs take'; row.id = `take${i}`; row.style.top = `${130 + i * 220}px`;
  row.innerHTML = `<div class="label">Take ${i + 1}</div><div class="bars" id="bars${i}"></div><div class="score" id="score${i}"></div><div class="scan" id="scan${i}"></div>`;
  const bars = row.querySelector('.bars');

    bars.appendChild(document.createElement('i')).style.height = `${h}px`;
  }
});

  const s = stamps.appendChild(document.createElement('span'));
  s.id = `w${i}`;

  return { at: w.start, anim: `#w${i}`, kf: { opacity: [0, 1] }, dur: .001, ease: 'linear' };
});

const land = document.getElementById('land');

});

/* Line blocks at their true widths. The fourth grows, as if rewritten, and later ones shift. */

const blockIds = ['a1', 'a2', 'a3', 'a4', 'a5', 'a6'];
const blocks = blockIds.map((id, i) => {
  const l = line(id), b = rail.appendChild(document.createElement('div'));
  b.className = `block${i === 3 ? ' hot' : ''}`; b.id = `block${i}`;
  b.style.left = `${(l.start - line('a1').start) * SCALE}px`;
  b.style.width = `${(l.end - l.start) * SCALE}px`;
  b.textContent = i + 1;
  if (i === 3) b.style.zIndex = 2;
  return b;
});

const strip = document.getElementById('strip');
for (let i = 0; i < 9; i++) strip.appendChild(document.createElement('i')).textContent = `frame ${Math.round(line('a9').start * 30) + i * 30}`;

const STEPS = [
  /* Typed */
  cut(0, '#s1'),
  { at: 'a1', type: '#t1', text: 'Someone typed this sentence.', dur: line('a1').end - line('a1').start },
  off('a1.end+0.42', '#s1'),

  /* Takes */
  cut('a2-0.02', '#s2'),
  ...[0, 1, 2].map(i => ({ at: ['a2', 'a2:reads', 'a2:more'][i], anim: `#bars${i}`, kf: { clipPath: ['inset(0 100% 0 0)', 'inset(0 0 0 0)'] }, dur: 1, ease: 'linear' })),
  /* A scan line reads each take from "checks" onward. */
  ...[0, 1, 2].flatMap(i => [
    { at: 'a3:checks', anim: `#scan${i}`, kf: { opacity: [0, 1] }, dur: .001, ease: 'linear' },
    { at: 'a3:checks', anim: `#scan${i}`, kf: { left: ['0px', '1410px'] }, dur: line('a3').words.find(w => w.w.startsWith('closest')).start - line('a3').words.find(w => w.w.startsWith('checks')).start, ease: 'linear' },
    { at: 'a3:closest', anim: `#scan${i}`, kf: { opacity: [1, 0] }, dur: .001, ease: 'linear' },
  ]),

  ...[0, 1, 2].filter(i => i !== winner.take).map(i => ({ at: 'a3:closest', set: `#take${i}`, cls: 'lost' })),
  { at: 'a3:wins', set: `#score${winner.take}`, text: `match ${winner.match.toFixed(2)}` },
  off('a3.end+0.38', '#s2'),

  hit('a4:stops-0.06', '#stop'),
  off('a4.end+0.48', '#s4'),

  /* Time stamps */

  ...wordSpans,
  off('a5.end+0.28', '#s5'),

  /* Landing on the word */
  cut('a6-0.02', '#s6'),

  cut('a6:now', '#now'),
  { at: 'a6:now', anim: '#now span', kf: { transform: ['scale(1.5)', 'scale(1)'] }, dur: .16, ease: 'out' },
  off('a6.end+0.66', '#now'),
  off('a6.end+0.66', '#s6'),

  /* A change moves the rest */
  cut('a7-0.02', '#s7'),

  { at: 'a7:spoken', anim: '#block3', kf: { width: [blocks[3].style.width, `${parseFloat(blocks[3].style.width) + GROW}px`] }, dur: .5, ease: 'move' },

  cut('a8', '#rail-note'),
  off('a8.end+0.38', '#s7'),

  /* Two outputs */
  cut('a9-0.02', '#s9'),
  { at: 'a9', anim: '#strip', kf: { transform: ['translateX(0)', 'translateX(-1500px)'] }, dur: line('a9').end - line('a9').start + .4, ease: 'linear' },
  hit('a9:video', '#o1', 1.08),
  hit('a9:interactive', '#o2', 1.08),
  off('a9.end+0.38', '#s9'),

  cut('a10-0.02', '#s10'),
  cut('a10:every', '#l1'),
  cut('a10:project', '#l2'),
  cut('a10:gets', '#l3'),
  cut('a10:new', '#l4'),
  off('a10.end+1.28', '#s10'),

  hit('a11:AI-0.08', '#ai', 1.1),
  off('a12-0.02', '#ai'),
  hit('a12:Word-0.08', '#name', 1.1),
  cut('a12:Cue', '#url'),
];
